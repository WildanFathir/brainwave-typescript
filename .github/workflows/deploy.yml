name: DEPLOY - Build & Push

on:
  push:
    branches: ['development']
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # (Opsional) build/test app
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build

      # Build & push Docker image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            wildanfathir/brainwave-test:${{ github.sha }}
            wildanfathir/brainwave-test:latest

      # Trigger Jenkins (CD) setelah push sukses
      - name: Trigger Jenkins CD
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${GITHUB_SHA}\"}" \
            "${{ secrets.JENKINS_WEBHOOK_URL }}"
