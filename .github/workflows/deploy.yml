name: DEPLOY - Build & Push

on:
  push:
    tags: ['v-dev*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # (Opsional) build/test app
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Vite
        run: npm run build

      # Build & push Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            wildanfathir/brainwave-test:${{ github.sha }}
            wildanfathir/brainwave-test:latest

      # Trigger Jenkins (CD) setelah push sukses
      - name: Trigger Jenkins CD
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${GITHUB_SHA}\"}" \
            "${{ secrets.JENKINS_WEBHOOK_URL }}"
